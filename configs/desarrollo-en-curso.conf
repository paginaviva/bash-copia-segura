# =============================================================
# desarrollo-en-curso.conf — Config activa para workspace de desarrollo
# Requiere: rclone configurado (ver docs/INSTALACION.md)
# =============================================================

METHOD="zip"

SOURCE="/workspaces/generador"

BACKUP_FOLDER="/workspaces/backup-incremental"

ARCHIVE_FOLDER="/workspaces/backup-archives"

RETENTION_DAYS=7

# Rclone — requiere rclone configurado (rclone config)
REMOTE_ENABLED="true"
REMOTE_DEST="remote:backups/bash-copia-segura"
REMOTE_OPTS=""
REMOTE_DELETE_SOURCE="false"

EXCLUDE_PATTERNS="*.tmp *.log node_modules .opencode/node_modules temp/metis-base-codespace"
