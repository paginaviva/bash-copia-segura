# =============================================================
# example.conf — Configuration template for copia-segura
# =============================================================

# Backup method: tar | zip | 7z | rsync
METHOD="tar"

# Source directory to back up (required for tar/zip/7z)
SOURCE="/path/to/your/source"

# Destination for rsync incremental backups (required if METHOD=rsync)
BACKUP_FOLDER="/path/to/rsync/destination"

# Destination for compressed archives (tar/zip/7z)
ARCHIVE_FOLDER="/path/to/archive/destination"

# Retention: days to keep backups before deletion
RETENTION_DAYS=7

# Remote upload via rclone
REMOTE_ENABLED="false"
REMOTE_DEST="remote:path/to/backups"
REMOTE_OPTS=""
REMOTE_DELETE_SOURCE="false"

# Exclusion patterns (space-separated, tool-specific syntax is handled)
EXCLUDE_PATTERNS="*.tmp *.log node_modules"
